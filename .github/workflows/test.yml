name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:testpass@localhost:5432/teardrop_test
      APP_ENV: test
      JWT_CLIENT_ID: test-client
      JWT_CLIENT_SECRET: ci-test-secret
      ANTHROPIC_API_KEY: dummy-key
      LANGSMITH_TRACING: "false"
      SKIP_INTEGRATION_TESTS: ""
      MCP_CLIENT_CONNECT_TIMEOUT_SECONDS: "30"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: teardrop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Generate RSA test keys
        # Run as a module so the repo root is on sys.path (teardrop.keys is
        # imported by the script); `python scripts/generate_keys.py` would add
        # only scripts/ to the path and fail with ModuleNotFoundError.
        run: python -m scripts.generate_keys

      - name: Run unit tests
        run: pytest tests/unit/ -n auto --dist load -v --cov=. --cov-fail-under=0 --cov-report=

      - name: Run API tests
        run: pytest tests/api/ -n auto --dist load -v --cov=. --cov-append --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -t teardrop:ci .

      - name: Smoke test startup
        run: |
          docker run -d --name teardrop-smoke \
            -e DATABASE_URL=postgresql://unused:unused@localhost:5432/unused \
            -e APP_ENV=test \
            -p 8000:8000 \
            teardrop:ci
          # Give the app time to start; the container must stay up (not crash on
          # startup) and the keys dir must be writable by the non-root user.
          sleep 15
          if ! docker ps --filter name=teardrop-smoke --format '{{.Status}}' | grep -q Up; then
            echo "Container failed to start (likely startup crash). Logs:"
            docker logs teardrop-smoke
            exit 1
          fi
          docker logs teardrop-smoke
          docker rm -f teardrop-smoke

  deploy:
    runs-on: ubuntu-latest
    needs: [test, docker-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Serialize deploys to main: if two pushes land close together, the second
    # deploy waits for the first to finish rather than firing concurrently.
    # cancel-in-progress: false ensures an in-flight deploy is never aborted.
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      - name: Trigger Render deploy
        run: curl -fsS "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
